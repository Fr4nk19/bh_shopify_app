name = "BH sync App"
client_id = "3db4d4448e8fae37fba7079d4be1ef1f"
application_url = "https://bh-shopify-sync-app.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "YOUR_DEV_STORE.myshopify.com"

[access_scopes]
scopes = "read_inventory,write_inventory,read_products,write_products,read_locations,read_customers,write_customers,read_orders"

[auth]
redirect_urls = [
  "https://bh-shopify-sync-app.up.railway.app/auth/callback",
  "https://bh-shopify-sync-app.up.railway.app/auth/shopify/callback",
  "https://bh-shopify-sync-app.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2024-07"

  [[webhooks.subscriptions]]
  topics = ["inventory_levels/update"]
  uri = "/webhooks/inventory-levels-update"

  [[webhooks.subscriptions]]
  topics = ["products/create"]
  uri = "/webhooks/products-create"

  [[webhooks.subscriptions]]
  topics = ["products/update"]
  uri = "/webhooks/products-update"

  [[webhooks.subscriptions]]
  topics = ["customers/create"]
  uri = "/webhooks/customers-create"

  [[webhooks.subscriptions]]
  topics = ["customers/update"]
  uri = "/webhooks/customers-update"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders-create"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app-uninstalled"

[pos]
embedded = false
